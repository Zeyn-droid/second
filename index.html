<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlizzardSMP — Мониторинг сервера</title>
    <style>
        /* Основные стили страницы */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1d3a, #020b18);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Контейнер карточки сервера */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Заголовок */
        h1 {
            margin-top: 0;
            font-size: 28px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        /* Индикатор статуса */
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .online {
            background-color: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .offline {
            background-color: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }

        /* Информация об игроках */
        .info-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .info-title {
            font-size: 14px;
            color: #a0a0a0;
        }

        .info-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Поле с IP адресом и кнопкой */
        .ip-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .ip-text {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            color: #00d2ff;
        }

        .copy-btn {
            background: #00d2ff;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .copy-btn:hover {
            background: #80e5ff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>BlizzardSMP</h1>
        
        <!-- Значок статуса (изменяется через JS) -->
        <div id="statusBadge" class="status-badge offline">Загрузка...</div>

        <!-- Данные об онлайне -->
        <div class="info-box">
            <div class="info-title">Игроков онлайн</div>
            <div id="playerCount" class="info-value">-- / --</div>
        </div>

        <div class="info-box">
            <div class="info-title">Версия сервера</div>
            <div id="serverVersion" class="info-value">--</div>
        </div>

        <!-- Скопировать IP -->
        <div class="ip-container">
            <div class="ip-text" id="serverIp">blizzard.mcsh.gg</div>
            <button class="copy-btn" onclick="copyIp()">Копировать</button>
        </div>
    </div>

    <script>
        // Константа с адресом твоего сервера
        const SERVER_IP = 'blizzard.mcsh.gg';

        // Функция получения статуса сервера через API
        async function fetchServerStatus() {
            const statusBadge = document.getElementById('statusBadge');
            const playerCount = document.getElementById('playerCount');
            const serverVersion = document.getElementById('serverVersion');

            try {
                // Используем бесплатный API mcsrvstat.us
                const response = await fetch(`https://api.mcsrvstat.us/2/${SERVER_IP}`);
                const data = await response.json();

                if (data.online) {
                    // Если сервер онлайн
                    statusBadge.textContent = '● Сервер работает';
                    statusBadge.className = 'status-badge online';
                    playerCount.textContent = `${data.players.online} / ${data.players.max}`;
                    serverVersion.textContent = data.version || 'Не определена';
                } else {
                    // Если сервер офлайн
                    statusBadge.textContent = '● Сервер выключен';
                    statusBadge.className = 'status-badge offline';
                    playerCount.textContent = '0 / 0';
                    serverVersion.textContent = 'Офлайн';
                }
            } catch (error) {
                console.error('Ошибка при получении данных:', error);
                statusBadge.textContent = '● Ошибка запроса';
                statusBadge.className = 'status-badge offline';
            }
        }

        // Функция копирования IP в буфер обмена
        function copyIp() {
            const ipText = document.getElementById('serverIp').innerText;
            navigator.clipboard.writeText(ipText).then(() => {
                alert('IP-адрес скопирован: ' + ipText);
            }).catch(err => {
                console.error('Не удалось скопировать: ', err);
            });
        }

        // Запускаем проверку при открытии страницы
        fetchServerStatus();

        // Обновляем данные каждые 30 секунд
        setInterval(fetchServerStatus, 30000);
    </script>
</body>
</html>
