<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlizzardSMP — Ванильный Minecraft Сервер</title>
    <style>
        /* ==========================================
           1. ОСНОВНЫЕ СТИЛИ И БЕЛЫЙ ФОН
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Чистый светлый/белый фон */
            background-color: #ffffff;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* ==========================================
           2. АНИМИРОВАННЫЕ "ЖИДКИЕ" ФОНОВЫЕ ПЯТНА (LIQUID BLOBS)
           ========================================== */
        .blob-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 12s infinite ease-in-out alternate;
        }

        .blob-1 {
            width: 350px;
            height: 350px;
            background: rgba(56, 189, 248, 0.35); /* Светло-голубой */
            top: 10%;
            left: 15%;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: rgba(147, 197, 253, 0.4); /* Нежно-синий */
            bottom: 10%;
            right: 15%;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.1); }
        }

        /* ==========================================
           3. ПОЛУПРОЗРАЧНЫЕ КАРТОЧКИ (LIQUID GLASS)
           ========================================== */
        .glass-card {
            position: relative;
            z-index: 1;
            /* Полупрозрачный белый цвет с эффектом размытия заднего фона */
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05),
                        inset 0 1px 1px rgba(255, 255, 255, 0.9);
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.08),
                        inset 0 1px 1px rgba(255, 255, 255, 1);
        }

        /* ==========================================
           4. ТЕКСТ И ЭЛЕМЕНТЫ ИНТЕРФЕЙСА
           ========================================== */
        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 24px;
        }

        /* Индикатор статуса сервера */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .status-badge.online {
            background: rgba(34, 197, 94, 0.12);
            color: #15803d;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-badge.offline {
            background: rgba(239, 68, 68, 0.12);
            color: #b91c1c;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .status-badge.online .status-dot {
            box-shadow: 0 0 8px #22c55e;
        }

        /* Полупрозрачные информационные блоки */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .info-title {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .info-value {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 4px;
        }

        /* Блок копирования IP */
        .ip-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 8px 8px 8px 16px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .ip-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 15px;
            font-weight: 600;
            color: #0369a1;
        }

        .copy-btn {
            background: linear-gradient(135deg, #0284c7, #0284c7);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* Эффект жидкой волны при нажатии (Liquid Ripple) */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.35);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Анимированный задний жидкий фон -->
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Основная полупрозрачная карточка -->
    <div class="glass-card" id="mainCard">
        <h1>BlizzardSMP</h1>
        <div class="subtitle">Чистый Vanilla SMP сервер</div>

        <!-- Статус сервера -->
        <div id="statusBadge" class="status-badge offline">
            <span class="status-dot"></span>
            <span id="statusText">Проверка сервера...</span>
        </div>

        <!-- Сетка с данными -->
        <div class="info-grid">
            <div class="info-box">
                <div class="info-title">Игроков онлайн</div>
                <div id="playerCount" class="info-value">-- / --</div>
            </div>
            <div class="info-box">
                <div class="info-title">Режим</div>
                <div class="info-value">Vanilla</div>
            </div>
        </div>

        <!-- Копирование IP -->
        <div class="ip-box">
            <span class="ip-text" id="serverIp">blizzard.mcsh.gg</span>
            <button class="copy-btn" onclick="copyIp(event)">Копировать</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 5. ЛОГИКА ПОЛУЧЕНИЯ ДАННЫХ И ИНТЕРАКТИВА
        // ==========================================
        const SERVER_IP = 'blizzard.mcsh.gg';

        // Запрос к API статуса сервера
        async function fetchServerStatus() {
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const playerCount = document.getElementById('playerCount');

            try {
                const response = await fetch(`https://api.mcsrvstat.us/2/${SERVER_IP}`);
                const data = await response.json();

                if (data.online) {
                    statusBadge.className = 'status-badge online';
                    statusText.textContent = 'Сервер онлайн';
                    playerCount.textContent = `${data.players.online} / ${data.players.max}`;
                } else {
                    statusBadge.className = 'status-badge offline';
                    statusText.textContent = 'Сервер офлайн';
                    playerCount.textContent = '0 / 0';
                }
            } catch (error) {
                console.error('Ошибка получения данных:', error);
                statusBadge.className = 'status-badge offline';
                statusText.textContent = 'Ошибка подключения';
            }
        }

        // Функция копирования IP
        function copyIp(event) {
            event.stopPropagation();
            const ipText = document.getElementById('serverIp').innerText;
            navigator.clipboard.writeText(ipText).then(() => {
                alert('IP-адрес скопирован: ' + ipText);
            });
        }

        // Жидкий эффект волны при касании / клике (Liquid Ripple)
        document.getElementById('mainCard').addEventListener('click', function (e) {
            const card = e.currentTarget;
            const circle = document.createElement('span');
            const diameter = Math.max(card.clientWidth, card.clientHeight);
            const radius = diameter / 2;

            const rect = card.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - rect.left - radius}px`;
            circle.style.top = `${e.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');

            const ripple = card.getElementsByClassName('ripple')[0];
            if (ripple) {
                ripple.remove();
            }

            card.appendChild(circle);
        });

        // Старт проверки при загрузке страницы
        fetchServerStatus();
        // Обновление каждые 30 секунд
        setInterval(fetchServerStatus, 30000);
    </script>
</body>
</html>
